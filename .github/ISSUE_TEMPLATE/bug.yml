name: 버그 제보
description: 기대한 동작과 실제 동작이 다른 문제를 등록합니다.
title: "[Bug] "
labels:
  - bug

body:
  - type: textarea
    id: summary
    attributes:
      label: 문제 설명
      description: 발생한 문제를 간결하게 설명해주세요.
      placeholder: |
        예)
        opacity: 0인 iframe 내부 Element가 TRANSPARENT 후보로 수집되지 않는다.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      description: 동일한 문제를 재현할 수 있는 순서를 작성해주세요.
      placeholder: |
        1. 테스트 서버를 실행한다.
        2. /test/iframe-transparent 페이지를 Scan한다.
        3. Scan 완료 후 Finding을 확인한다.
        4. 대상 Element가 결과에 포함되지 않는다.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 정상적으로 동작한다면 어떤 결과가 나와야 하는지 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 현재 실제로 발생하는 결과를 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: 문제와 관련 있는 실행 환경을 작성해주세요.
      placeholder: |
        - OS: Windows 11
        - JDK:
        - Playwright:
        - Browser:
        - Branch / Commit:

  - type: textarea
    id: logs
    attributes:
      label: 로그 / 오류 메시지
      description: 관련 로그나 Stack Trace가 있다면 첨부해주세요.
      render: shell

  - type: textarea
    id: scope
    attributes:
      label: 영향 범위
      description: 문제가 영향을 미치는 기능이나 범위를 알고 있다면 작성해주세요.

  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 스크린샷, 관련 Issue, 추정 원인 등이 있다면 작성해주세요.